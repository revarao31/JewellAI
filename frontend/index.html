
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JewellAI — Smart Jewellery Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>

  <style>
    :root {
      --bg: #faf7f1;
      --paper: #fffdf9;
      --gold: #b58a4b;
      --gold-dark: #87622f;
      --gold-pale: #f2e6d1;
      --ink: #2d281f;
      --muted: #82786a;
      --line: #e9dfd0;
      --green: #43845d;
      --red: #b65343;
      --shadow: 0 12px 35px rgba(69, 48, 20, .08);
    }

    * { box-sizing: border-box; }

    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, #f2e6d1 0, transparent 30%),
        radial-gradient(circle at 90% 90%, #f4eadb 0, transparent 28%),
        var(--bg);
    }

    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      height: 100%;
      max-width: 1000px;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: rgba(255,253,249,.88);
      box-shadow: 0 0 70px rgba(69,48,20,.06);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 15px 24px;
      background: rgba(255,253,249,.94);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

    .brand-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      font-size: 24px;
      background: linear-gradient(145deg, #f8ebd2, #d2ad70);
      box-shadow: 0 5px 16px #b58a4b25;
      flex-shrink: 0;
    }

    .brand h1 {
      font: 600 25px "Playfair Display", serif;
      margin: 0;
      letter-spacing: -.4px;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .header-right { display: flex; align-items: center; gap: 9px; }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
    }

    .status-dot.off { background: var(--red); }

    .icon-button {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      width: 39px;
      height: 39px;
      border-radius: 13px;
      cursor: pointer;
    }

    .icon-button:hover { border-color: var(--gold); }

    .rate-area {
      padding: 15px 24px 0;
      flex-shrink: 0;
    }

    .rate-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .rate-heading strong { font-size: 12px; letter-spacing: .5px; }
    .rate-heading span { color: var(--muted); font-size: 11px; }

    .rates {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .rate-card {
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 13px 16px;
      background: white;
      box-shadow: 0 4px 15px #4b32100a;
      min-width: 0;
    }

    .rate-label { color: var(--muted); font-size: 12px; }

    .rate-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 13px;
    }

    .metal-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      background: var(--gold-pale);
      border-radius: 10px;
      font-size: 16px;
    }

    .rate-value {
      font: 600 22px "Playfair Display", serif;
      overflow-wrap: anywhere;
    }

    .rate-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .rate-error { color: var(--muted); font-size: 12px; margin-top: 5px; }

    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 17px;
      scroll-behavior: smooth;
    }

    .welcome {
      margin: auto 0;
      text-align: center;
      padding: 20px 8px;
    }

    .welcome-symbol {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 17px;
      font-size: 36px;
      border-radius: 25px;
      background: linear-gradient(145deg, #fff6e4, #ead0a0);
      box-shadow: 0 10px 30px #8b65251b;
    }

    .welcome h2 {
      font: 600 clamp(27px, 4vw, 36px) "Playfair Display", serif;
      margin: 0 0 10px;
      background: linear-gradient(100deg, #634825, #bd9252, #76552c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome p {
      max-width: 480px;
      margin: 0 auto 22px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      max-width: 700px;
      margin: auto;
    }

    .suggestion {
      text-align: left;
      border: 1px solid var(--line);
      background: white;
      border-radius: 15px;
      padding: 13px;
      cursor: pointer;
      color: var(--ink);
      transition: .2s ease;
      min-height: 84px;
    }

    .suggestion:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .suggestion-icon { display: block; font-size: 21px; margin-bottom: 7px; }
    .suggestion strong { font-size: 12px; display: block; }
    .suggestion small { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }

    .message-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      animation: appear .22s ease;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user { justify-content: flex-end; }

    .avatar {
      width: 35px;
      height: 35px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--gold-pale);
    }

    .message-content { max-width: min(78%, 650px); min-width: 0; }

    .bubble {
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 5px 17px 17px 17px;
      background: white;
      line-height: 1.7;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      color: white;
      background: #84623a;
      border-color: #84623a;
      border-radius: 17px 5px 17px 17px;
    }

    .bubble p { margin: 0 0 9px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { padding-left: 22px; }
    .bubble a { color: var(--gold-dark); }
    .bubble table { display: block; overflow-x: auto; border-collapse: collapse; }
    .bubble th, .bubble td { padding: 6px 9px; border: 1px solid var(--line); }
    .bubble th { background: var(--gold-pale); }

    .message-actions {
      display: flex;
      gap: 12px;
      padding: 5px 0 0 3px;
    }

    .text-button {
      background: none;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      padding: 3px;
      font-size: 11px;
    }

    .text-button:hover { color: var(--gold-dark); }

    .typing {
      display: flex;
      gap: 5px;
      padding: 6px 0;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      animation: bounce 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .error-note {
      color: var(--red);
      background: #fff1ed;
      border: 1px solid #f2d5ce;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
    }

    .composer-area {
      padding: 12px 24px 17px;
      background: rgba(255,253,249,.97);
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }

    .composer {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      border: 1px solid #ded1bd;
      border-radius: 18px;
      padding: 8px 9px 8px 15px;
      background: white;
      box-shadow: 0 5px 20px #5b42100a;
    }

    .composer:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px #b58a4b17;
    }

    .composer textarea {
      flex: 1;
      width: 100%;
      min-width: 0;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      padding: 8px 0;
      max-height: 120px;
      min-height: 40px;
      font-size: 14px;
      line-height: 1.5;
    }

    .composer textarea::placeholder { color: #a59b8d; }

    .send-button {
      flex-shrink: 0;
      width: 43px;
      height: 43px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(145deg, #c8a36a, #98713c);
      color: white;
      font-size: 19px;
      cursor: pointer;
    }

    .send-button:disabled { opacity: .5; cursor: not-allowed; }

    .composer-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 3px 0;
      gap: 8px;
    }

    .tool-buttons { display: flex; gap: 7px; flex-wrap: wrap; }

    .tool-chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      color: var(--muted);
      padding: 6px 10px;
      cursor: pointer;
      font-size: 11px;
    }

    .tool-chip:hover { border-color: var(--gold); color: var(--gold-dark); }
    .disclaimer { color: #a09688; font-size: 10px; text-align: right; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #21190fc0;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 23px;
      box-shadow: 0 25px 80px #0003;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .modal h3 { font: 600 24px "Playfair Display", serif; margin: 0; }
    .close-button { border: 0; background: transparent; font-size: 24px; cursor: pointer; }

    .field { margin-bottom: 14px; }
    .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }

    .field input, .field select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      outline: none;
    }

    .field input:focus, .field select:focus { border-color: var(--gold); }

    .calculate-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      background: #84623a;
      color: white;
      cursor: pointer;
    }

    .calc-result {
      margin-top: 15px;
      padding: 14px;
      border-radius: 14px;
      background: var(--gold-pale);
      line-height: 1.7;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .topbar { padding: 12px 14px; }
      .brand-icon { width: 40px; height: 40px; border-radius: 13px; }
      .brand h1 { font-size: 22px; }
      .brand p { font-size: 10px; }
      .status { font-size: 0; gap: 0; }
      .status-dot { width: 9px; height: 9px; }
      .header-right { gap: 7px; }
      .icon-button { width: 36px; height: 36px; }
      .rate-area { padding: 12px 14px 0; }
      .rate-card { padding: 11px; }
      .rate-value { font-size: 19px; }
      .chat { padding: 17px 14px; }
      .suggestions { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .suggestion { padding: 11px; min-height: 78px; }
      .message-content { max-width: 86%; }
      .bubble { font-size: 13px; padding: 11px 13px; }
      .composer-area { padding: 10px 12px 12px; }
      .composer-tools { align-items: flex-start; }
      .disclaimer { max-width: 110px; line-height: 1.4; }
    }

    @media (max-width: 360px) {
      .brand { gap: 8px; }
      .brand h1 { font-size: 19px; }
      .rates { gap: 7px; }
      .rate-value { font-size: 16px; }
      .tool-chip { padding: 6px 8px; }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback } = React;

    const SUGGESTIONS = [
      { icon: "🪙", title: "Gold Rate", detail: "Check today's gold price", query: "What is today's gold rate? Explain 22K and 24K prices." },
      { icon: "🥈", title: "Silver Rate", detail: "Know the silver price", query: "What is today's silver rate?" },
      { icon: "💎", title: "Diamond Guide", detail: "Understand the 4Cs", query: "Explain the 4Cs of diamonds before buying jewellery." },
      { icon: "✨", title: "Latest Trends", detail: "Explore jewellery styles", query: "What jewellery design trends are popular right now?" },
      { icon: "💍", title: "Wedding Jewellery", detail: "Find your perfect look", query: "Suggest jewellery for a traditional Indian wedding." },
      { icon: "🛍️", title: "Buying Guide", detail: "Buy with confidence", query: "How do I check BIS hallmarking and HUID on gold jewellery?" }
    ];

    function safeMarkdown(text) {
      const raw = window.marked
        ? marked.parse(String(text || ""), { breaks: true })
        : String(text || "").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
      return {
        __html: window.DOMPurify
          ? DOMPurify.sanitize(raw)
          : raw
      };
    }

    function formatINR(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "—";
      return "₹" + number.toLocaleString("en-IN", {
        maximumFractionDigits: 2,
        minimumFractionDigits: 2
      });
    }

    function getRateValue(data) {
      if (!data || typeof data !== "object") return null;
      return data.sell ?? data.rate ?? data.price ?? data.buy ?? null;
    }

    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [online, setOnline] = useState(false);
      const [error, setError] = useState("");
      const [rates, setRates] = useState({
        gold: null,
        silver: null,
        updated: null,
        loading: true
      });
      const [showCalc, setShowCalc] = useState(false);
      const [weight, setWeight] = useState("10");
      const [goldRate, setGoldRate] = useState("");
      const [purity, setPurity] = useState("22");
      const [makingCharge, setMakingCharge] = useState("10");
      const [calcResult, setCalcResult] = useState(null);

      const chatRef = useRef(null);
      const inputRef = useRef(null);
      const lastQuestionRef = useRef("");

      const loadRates = useCallback(async () => {
        setRates(previous => ({ ...previous, loading: true }));

        try {
          const [goldResponse, silverResponse] = await Promise.all([
            fetch("/api/gold-rate"),
            fetch("/api/silver-rate")
          ]);

          const goldData = await goldResponse.json();
          const silverData = await silverResponse.json();

          setRates({
            gold: goldData && goldData.available !== false ? goldData : null,
            silver: silverData && silverData.available !== false ? silverData : null,
            updated: goldData?.updated_at || silverData?.updated_at || null,
            loading: false
          });

          const currentGoldRate = getRateValue(goldData);
          if (currentGoldRate && !goldRate) {
            setGoldRate(String(currentGoldRate));
          }
        } catch (err) {
          setRates(previous => ({ ...previous, loading: false }));
        }
      }, [goldRate]);

      useEffect(() => {
        fetch("/api/health")
          .then(response => {
            if (!response.ok) throw new Error("Backend unavailable");
            return response.json();
          })
          .then(data => setOnline(!!data.gemini_configured))
          .catch(() => setOnline(false));

        loadRates();
      }, [loadRates]);

      useEffect(() => {
        if (chatRef.current) {
          chatRef.current.scrollTop = chatRef.current.scrollHeight;
        }
      }, [messages, loading]);

      async function sendMessage(text = input) {
        const question = String(text || "").trim();
        if (!question || loading) return;

        lastQuestionRef.current = question;
        setError("");
        setInput("");

        const userMessage = { role: "user", content: question };
        setMessages(previous => [...previous, userMessage]);
        setLoading(true);

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: question })
          });

          let data = {};
          try {
            data = await response.json();
          } catch (_) {
            data = {};
          }

          if (!response.ok) {
            throw new Error(data.error || data.message || `Request failed (${response.status})`);
          }

          const answer =
            data.reply ??
            data.response ??
            data.answer ??
            data.message ??
            "I received your message, but the backend returned an empty reply.";

          setMessages(previous => [
            ...previous,
            { role: "assistant", content: String(answer) }
          ]);
        } catch (err) {
          setError(
            "I couldn't connect to the chat service. Please check that your Flask backend is running and /api/chat is available. " +
            (err.message || "")
          );
        } finally {
          setLoading(false);
          setTimeout(() => inputRef.current?.focus(), 50);
        }
      }

      async function retryLast() {
        if (!lastQuestionRef.current || loading) return;
        setMessages(previous => {
          const copy = [...previous];
          if (copy[copy.length - 1]?.role === "assistant") copy.pop();
          return copy;
        });
        await sendMessage(lastQuestionRef.current);
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch (_) {
          const area = document.createElement("textarea");
          area.value = text;
          document.body.appendChild(area);
          area.select();
          document.execCommand("copy");
          area.remove();
        }
      }

      function handleKeyDown(event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      }

      function calculatePrice() {
        const grams = Number(weight);
        const rate = Number(goldRate);
        const making = Number(makingCharge);
        const purityFactor = Number(purity) / 24;

        if (!(grams > 0) || !(rate > 0) || !(making >= 0)) {
          setCalcResult({ error: "Please enter a valid weight, gold rate and making charge." });
          return;
        }

        const metalValue = grams * rate * purityFactor;
        const makingValue = metalValue * making / 100;
        const beforeGST = metalValue + makingValue;
        const gst = beforeGST * 0.03;
        const total = beforeGST + gst;

        setCalcResult({
          metalValue,
          makingValue,
          gst,
          total
        });
      }

      function clearChat() {
        setMessages([]);
        setError("");
        lastQuestionRef.current = "";
      }

      const goldRateValue = getRateValue(rates.gold);
      const silverRateValue = getRateValue(rates.silver);

      return (
        <div className="app">
          <header className="topbar">
            <div className="brand">
              <div className="brand-icon">👑</div>
              <div>
                <h1>JewellAI</h1>
                <p>Your Smart Jewellery Assistant</p>
              </div>
            </div>

            <div className="header-right">
              <div className="status" title={online ? "Chat service connected" : "Chat service unavailable"}>
                <span className={"status-dot " + (!online ? "off" : "")}></span>
                {online ? "Assistant online" : "Connecting"}
              </div>
              <button
                className="icon-button"
                title="Clear conversation"
                aria-label="Clear conversation"
                onClick={clearChat}
              >↻</button>
            </div>
          </header>

          <section className="rate-area">
            <div className="rate-heading">
              <strong>MARKET SNAPSHOT</strong>
              <span>
                {rates.loading
                  ? "Updating rates…"
                  : rates.updated
                    ? "Updated " + new Date(rates.updated).toLocaleString("en-IN", {
                        dateStyle: "medium",
                        timeStyle: "short"
                      })
                    : "Live rate feed"}
              </span>
            </div>

            <div className="rates">
              <div className="rate-card">
                <div className="rate-title">
                  <span className="metal-icon">🪙</span>
                  Gold
                </div>
                <div className="rate-value">
                  {rates.loading ? "Loading…" : goldRateValue != null ? formatINR(goldRateValue) : "Unavailable"}
                </div>
                <div className="rate-sub">Price as returned by your rate provider</div>
              </div>

              <div className="rate-card">
                <div className="rate-title">
                  <span className="metal-icon">🥈</span>
                  Silver
                </div>
                <div className="rate-value">
                  {rates.loading ? "Loading…" : silverRateValue != null ? formatINR(silverRateValue) : "Unavailable"}
                </div>
                <div className="rate-sub">Price as returned by your rate provider</div>
              </div>
            </div>
          </section>

          <main className="chat" ref={chatRef}>
            {messages.length === 0 ? (
              <section className="welcome">
                <div className="welcome-symbol">💍</div>
                <h2>Your jewellery journey starts here.</h2>
                <p>
                  Discover gold and silver rates, learn how to buy jewellery confidently,
                  explore trends and get personalised jewellery guidance.
                </p>

                <div className="suggestions">
                  {SUGGESTIONS.map(item => (
                    <button
                      className="suggestion"
                      key={item.title}
                      onClick={() => sendMessage(item.query)}
                    >
                      <span className="suggestion-icon">{item.icon}</span>
                      <strong>{item.title}</strong>
                      <small>{item.detail}</small>
                    </button>
                  ))}
                </div>
              </section>
            ) : (
              messages.map((message, index) => (
                <div className={"message-row " + (message.role === "user" ? "user" : "assistant")} key={index}>
                  {message.role !== "user" && <div className="avatar">✨</div>}
                  <div className="message-content">
                    <div className="bubble">
                      {message.role === "user"
                        ? message.content
                        : <div dangerouslySetInnerHTML={safeMarkdown(message.content)} />}
                    </div>
                    {message.role === "assistant" && (
                      <div className="message-actions">
                        <button className="text-button" onClick={() => copyText(message.content)}>Copy</button>
                        {index === messages.length - 1 && (
                          <button className="text-button" onClick={retryLast}>Retry</button>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              ))
            )}

            {loading && (
              <div className="message-row assistant">
                <div className="avatar">✨</div>
                <div className="bubble">
                  <div className="typing" aria-label="JewellAI is typing">
                    <span></span><span></span><span></span>
                  </div>
                </div>
              </div>
            )}

            {error && <div className="error-note">{error}</div>}
          </main>

          <footer className="composer-area">
            <div className="composer">
              <textarea
                ref={inputRef}
                value={input}
                onChange={event => setInput(event.target.value)}
                onKeyDown={handleKeyDown}
                placeholder="Ask anything about jewellery…"
                rows="1"
                aria-label="Message JewellAI"
              />
              <button
                className="send-button"
                onClick={() => sendMessage()}
                disabled={!input.trim() || loading}
                aria-label="Send message"
                title="Send message"
              >➤</button>
            </div>

            <div className="composer-tools">
              <div className="tool-buttons">
                <button className="tool-chip" onClick={() => setShowCalc(true)}>🧮 Price calculator</button>
                <button className="tool-chip" onClick={loadRates}>↻ Refresh rates</button>
              </div>
              <span className="disclaimer">Prices may vary by jeweller and location.</span>
            </div>
          </footer>

          {showCalc && (
            <div className="modal-backdrop" onClick={event => {
              if (event.target === event.currentTarget) setShowCalc(false);
            }}>
              <section className="modal" role="dialog" aria-modal="true" aria-label="Jewellery price calculator">
                <div className="modal-header">
                  <h3>Gold Price Calculator</h3>
                  <button className="close-button" onClick={() => setShowCalc(false)} aria-label="Close calculator">×</button>
                </div>

                <div className="field">
                  <label>Gold weight (grams)</label>
                  <input type="number" min="0" step="0.01" value={weight}
                    onChange={event => setWeight(event.target.value)} />
                </div>

                <div className="field">
                  <label>Gold rate per gram (24K, ₹)</label>
                  <input type="number" min="0" step="0.01" value={goldRate}
                    onChange={event => setGoldRate(event.target.value)}
                    placeholder="Enter rate per gram" />
                </div>

                <div className="field">
                  <label>Gold purity</label>
                  <select value={purity} onChange={event => setPurity(event.target.value)}>
                    <option value="24">24K — 99.9%</option>
                    <option value="22">22K — 91.6%</option>
                    <option value="18">18K — 75%</option>
                    <option value="14">14K — 58.5%</option>
                  </select>
                </div>

                <div className="field">
                  <label>Making charge (%)</label>
                  <input type="number" min="0" step="0.5" value={makingCharge}
                    onChange={event => setMakingCharge(event.target.value)} />
                </div>

                <button className="calculate-button" onClick={calculatePrice}>Calculate estimate</button>

                {calcResult && (
                  <div className="calc-result">
                    {calcResult.error ? (
                      calcResult.error
                    ) : (
                      <>
                        <div>Gold value: <strong>{formatINR(calcResult.metalValue)}</strong></div>
                        <div>Making charges: <strong>{formatINR(calcResult.makingValue)}</strong></div>
                        <div>Estimated GST (3%): <strong>{formatINR(calcResult.gst)}</strong></div>
                        <hr />
                        <div>Estimated total: <strong>{formatINR(calcResult.total)}</strong></div>
                        <small>This is an estimate. Stone charges, wastage and jeweller-specific fees may be extra.</small>
                      </>
                    )}
                  </div>
                )}
              </section>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
